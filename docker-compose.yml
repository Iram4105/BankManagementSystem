version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: bank_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: bank_management_system

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  bank-app:
    build: .

    container_name: bank_management_system

    restart: always

    depends_on:
      - mysql

    ports:
      - "8081:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bank_management_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234

volumes:
  mysql_data: